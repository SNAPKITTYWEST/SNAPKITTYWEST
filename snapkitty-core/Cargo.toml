[package]
name = "snapkitty-core"
version = "0.1.0"
edition = "2021"
description = "SnapKitty verified autonomous OS core"
license = "MIT OR Apache-2.0"

[lib]
name = "snapkitty_core"
path = "src/lib.rs"

[[bin]]
name = "snapkitty-gate"
path = "src/main.rs"

[[bin]]
name = "snapkitty-bridge"
path = "src/bridge.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
